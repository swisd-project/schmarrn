<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{seoHead}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;600;700&display=swap">
  <link rel="stylesheet" href="{{themeBase}}assets/theme.css">
  <script src="{{themeBase}}assets/deck.js" defer></script>
</head>
<body class="slide">
  <header class="slide-brand">
    <a href="/">{{siteName}}</a>
    {{navHtml}}
  </header>

  <main class="slide-stage">
{{bodyHtml}}
  </main>

  <footer class="slide-foot">
    <span class="site-name">{{siteName}}</span>
    <span>© {{year}}</span>
  </footer>
</body>
</html>
