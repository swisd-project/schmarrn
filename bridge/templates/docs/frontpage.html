<!doctype html>
<!--
  frontpage — the home page's layout. The crown applies it automatically
  (one home, one frontpage); the name is reserved and is never written
  into a page's frontmatter. The docs landing: a top bar, a bare hero —
  the project's name and claim — then the page body as the quick start.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{seoHead}}
  <link rel="stylesheet" href="/bridge/assets/noto/noto.css">
  <link rel="stylesheet" href="{{themeBase}}assets/theme.css">
</head>
<body class="frontpage">
  <header class="site-head">
    <a class="brand" href="/">
      {{logoHtml}}
      <span class="site-name">{{siteName}}</span>
    </a>
    {{navHtml}}
  </header>

  <main>
    <section class="doc-hero">
      <h1>{{siteName}}</h1>
      {{claimHtml}}
    </section>
{{bodyHtml}}
  </main>

  <footer class="site-foot">
    <p>© {{year}} {{siteName}}</p>
  </footer>
</body>
</html>
